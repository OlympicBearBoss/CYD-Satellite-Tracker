name: CYD firmware build # V96 QMC5883P + ADXL345

on:
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  push:
    branches: [main]
    tags:
      - "firmware-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio pillow

      - name: Resolve firmware version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/firmware-* ]]; then
            FW_VERSION="${GITHUB_REF_NAME#firmware-}"
          else
            FW_VERSION="$(head -n 1 firmware/VERSION | tr -d '[:space:]')"
          fi
          if ! printf '%s\n' "$FW_VERSION" | grep -Eq '^[v][0-9]{4}[.][0-9]{2}[.][0-9]{2}[.][0-9]+$'; then
            echo "::error::Invalid firmware version: $FW_VERSION"
            exit 1
          fi
          echo "FW_VERSION=$FW_VERSION" >> "$GITHUB_ENV"
          echo "Building firmware version $FW_VERSION"

      - name: Verify TLS configuration
        working-directory: firmware
        run: |
          set -euo pipefail
          if grep -n 'setInsecure' src/main.cpp; then
            echo "::error::Insecure TLS verification is forbidden"
            exit 1
          fi
          grep -q 'client.setCACert(CELESTRAK_CA_BUNDLE)' src/main.cpp
          grep -q 'USERTrust RSA Certification Authority' src/main.cpp
          grep -q 'Sectigo Public Server Authentication Root R46' src/main.cpp
          grep -q 'GTS Root R1' src/main.cpp

      - name: Build CYD firmware
        working-directory: firmware
        run: |
          set -euo pipefail
          mkdir -p ../build-staging/main ../build-staging/motor-test
          pio run -e cyd_esp32_2432s028
          cp .pio/build/cyd_esp32_2432s028/{bootloader.bin,partitions.bin,firmware.bin,firmware.elf} ../build-staging/main/
          pio run -e cyd_motor_test
          cp .pio/build/cyd_motor_test/{bootloader.bin,partitions.bin,firmware.bin,firmware.elf} ../build-staging/motor-test/

      - name: Collect firmware and create full-flash image
        shell: bash
        run: |
          set -euo pipefail
          # Build outputs are copied to staging immediately after each build,
          # so a subsequent PlatformIO environment cannot overwrite them.
          BUILD_DIR="build-staging/main"
          MOTOR_BUILD_DIR="build-staging/motor-test"
          if [[ "$BUILD_DIR" == "." || ! -f "$BUILD_DIR/firmware.bin" ]]; then
            echo "::error::Main firmware build output not found"
            find "$GITHUB_WORKSPACE" -maxdepth 7 -type f -name bootloader.bin -print || true
            exit 1
          fi
          if [[ "$MOTOR_BUILD_DIR" == "." || ! -f "$MOTOR_BUILD_DIR/firmware.bin" ]]; then
            echo "::error::Motor-test build output not found"
            find "$GITHUB_WORKSPACE" -maxdepth 7 -type f -name bootloader.bin -print || true
            exit 1
          fi
          echo "Main build directory: $BUILD_DIR"
          echo "Motor test build directory: $MOTOR_BUILD_DIR"
          mkdir -p release

          cp "$BUILD_DIR/bootloader.bin" release/CYD-Satellite-Tracker-${FW_VERSION}-bootloader.bin
          cp "$BUILD_DIR/partitions.bin" release/CYD-Satellite-Tracker-${FW_VERSION}-partitions.bin
          cp "$BUILD_DIR/firmware.bin" release/CYD-Satellite-Tracker-${FW_VERSION}-application.bin
          cp "$BUILD_DIR/firmware.elf" release/CYD-Satellite-Tracker-${FW_VERSION}.elf

          cp "$MOTOR_BUILD_DIR/firmware.bin" release/CYD-Satellite-Tracker-${FW_VERSION}-motor-test-application.bin
          cp "$MOTOR_BUILD_DIR/firmware.elf" release/CYD-Satellite-Tracker-${FW_VERSION}-motor-test.elf

          BOOT_APP0="$(find "$HOME/.platformio/packages" -type f -name boot_app0.bin -print -quit)"
          if [[ -z "$BOOT_APP0" || ! -f "$BOOT_APP0" ]]; then
            echo "::error::boot_app0.bin was not found in the installed Arduino-ESP32 framework"
            find "$HOME/.platformio/packages" -maxdepth 5 -type f -name '*boot*app*.bin' -print || true
            exit 1
          fi
          cp "$BOOT_APP0" release/CYD-Satellite-Tracker-${FW_VERSION}-boot_app0.bin

          # PlatformIO installs esptool under tool-esptoolpy.
          # Check the Python entry point first, then the legacy executable name.
          ESPTOOL_SCRIPT="$(find "$HOME/.platformio/packages" -type f -name esptool.py -print -quit)"
          if [[ -z "$ESPTOOL_SCRIPT" ]]; then
            ESPTOOL_SCRIPT="$(find "$HOME/.platformio/packages" -type f -name esptool -print -quit)"
          fi
          if [[ -z "$ESPTOOL_SCRIPT" || ! -f "$ESPTOOL_SCRIPT" ]]; then
            echo "::error::esptool Python entry point was not found in PlatformIO packages"
            find "$HOME/.platformio/packages" -maxdepth 5 -type f -iname '*esptool*' -print || true
            exit 1
          fi
          echo "Using esptool: $ESPTOOL_SCRIPT"
          # esptool 4.9 uses underscore option names and --output for merge_bin.
          python "$ESPTOOL_SCRIPT" --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            --output release/CYD-Satellite-Tracker-${FW_VERSION}-full-flash.bin \
            0x1000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

          cat > release/FLASH-INSTRUCTIONS-${FW_VERSION}.txt <<EOF
          CYD ESP32-2432S028 — full flash image

          Recommended: flash CYD-Satellite-Tracker-${FW_VERSION}-full-flash.bin at address 0x0000.
          This merged image includes bootloader, partition table, boot_app0 metadata,
          and the application. It is built for 4 MB flash with the project's huge_app.csv.

          Alternative manual images:
            CYD-Satellite-Tracker-${FW_VERSION}-bootloader.bin  0x1000
            CYD-Satellite-Tracker-${FW_VERSION}-partitions.bin 0x8000
            CYD-Satellite-Tracker-${FW_VERSION}-boot_app0.bin   0xE000
            CYD-Satellite-Tracker-${FW_VERSION}-application.bin  0x10000

          Select ESP32 (not ESP32-S2/S3/C3), 4 MB flash. If using esptool, erase flash
          before first installation when migrating from a different partition layout.
          Erasing flash deletes existing settings/data.
          EOF

          python "$ESPTOOL_SCRIPT" --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            --output release/CYD-Satellite-Tracker-${FW_VERSION}-motor-test-full-flash.bin \
            0x1000 "$MOTOR_BUILD_DIR/bootloader.bin" \
            0x8000 "$MOTOR_BUILD_DIR/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$MOTOR_BUILD_DIR/firmware.bin"

          cat > release/MOTOR-TEST-INSTRUCTIONS-${FW_VERSION}.txt <<EOF
          CYD motor pulse test image
          Flash the motor-test-full-flash image at 0x0000. Serial 115200 baud.
          Commands: AZ+, AZ-, EL+, EL-. Each sends 8 pulses at 250 steps/s.
          No automatic movement; EN is not controlled by firmware. Verify driver current,
          coil pairs, supply and common ground before enabling drivers.
          EOF

          NOTES_FILE="docs/releases/${FW_VERSION}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "::error::Missing release notes: $NOTES_FILE"
            exit 1
          fi
          cp "$NOTES_FILE" "release/CHANGELOG-${FW_VERSION}.md"
          {
            echo "Firmware version: $FW_VERSION"
            echo "Source commit: $GITHUB_SHA"
            echo "Git ref: $GITHUB_REF"
            echo "Build date UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "release/BUILD-INFO-${FW_VERSION}.txt"

          sha256sum release/* > release/SHA256SUMS-${FW_VERSION}.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CYD-Satellite-Tracker-firmware-${{ env.FW_VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish permanent GitHub Release
        if: startsWith(github.ref, 'refs/tags/firmware-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CYD Satellite Tracker ${{ env.FW_VERSION }}
          body_path: docs/releases/${{ env.FW_VERSION }}.md
          files: release/*
          fail_on_unmatched_files: true

# CI retrigger after correcting esptool 4.9 merge_bin option names.
