name: CYD firmware build # V85 generic satellite selection and on-device SGP4

on:
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio pillow

      - name: Verify TLS configuration
        working-directory: firmware
        run: |
          set -euo pipefail
          if grep -n 'setInsecure' src/main.cpp; then
            echo "::error::Insecure TLS verification is forbidden"
            exit 1
          fi
          grep -q 'client.setCACert(CELESTRAK_CA_BUNDLE)' src/main.cpp
          grep -q 'USERTrust RSA Certification Authority' src/main.cpp
          grep -q 'Sectigo Public Server Authentication Root R46' src/main.cpp

      - name: Build CYD firmware
        working-directory: firmware
        run: pio run -e cyd_esp32_2432s028

      - name: Collect firmware and create full-flash image
        shell: bash
        run: |
          set -euo pipefail
          FW_VERSION="v2026.11.12.85"
          BUILD_DIR="firmware/.pio/build/cyd_esp32_2432s028"
          mkdir -p release

          cp "$BUILD_DIR/bootloader.bin" release/CYD-Satellite-Tracker-${FW_VERSION}-bootloader.bin
          cp "$BUILD_DIR/partitions.bin" release/CYD-Satellite-Tracker-${FW_VERSION}-partitions.bin
          cp "$BUILD_DIR/firmware.bin" release/CYD-Satellite-Tracker-${FW_VERSION}-application.bin
          cp "$BUILD_DIR/firmware.elf" release/CYD-Satellite-Tracker-${FW_VERSION}.elf

          BOOT_APP0="$(find "$HOME/.platformio/packages" -type f -name boot_app0.bin -print -quit)"
          if [[ -z "$BOOT_APP0" || ! -f "$BOOT_APP0" ]]; then
            echo "::error::boot_app0.bin was not found in the installed Arduino-ESP32 framework"
            find "$HOME/.platformio/packages" -maxdepth 5 -type f -name '*boot*app*.bin' -print || true
            exit 1
          fi
          cp "$BOOT_APP0" release/CYD-Satellite-Tracker-${FW_VERSION}-boot_app0.bin

          # PlatformIO installs esptool under tool-esptoolpy.
          # Check the Python entry point first, then the legacy executable name.
          ESPTOOL_SCRIPT="$(find "$HOME/.platformio/packages" -type f -name esptool.py -print -quit)"
          if [[ -z "$ESPTOOL_SCRIPT" ]]; then
            ESPTOOL_SCRIPT="$(find "$HOME/.platformio/packages" -type f -name esptool -print -quit)"
          fi
          if [[ -z "$ESPTOOL_SCRIPT" || ! -f "$ESPTOOL_SCRIPT" ]]; then
            echo "::error::esptool Python entry point was not found in PlatformIO packages"
            find "$HOME/.platformio/packages" -maxdepth 5 -type f -iname '*esptool*' -print || true
            exit 1
          fi
          echo "Using esptool: $ESPTOOL_SCRIPT"
          # esptool 4.9 uses underscore option names and --output for merge_bin.
          python "$ESPTOOL_SCRIPT" --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            --output release/CYD-Satellite-Tracker-${FW_VERSION}-full-flash.bin \
            0x1000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

          cat > release/FLASH-INSTRUCTIONS-${FW_VERSION}.txt <<EOF
          CYD ESP32-2432S028 — full flash image

          Recommended: flash CYD-Satellite-Tracker-${FW_VERSION}-full-flash.bin at address 0x0000.
          This merged image includes bootloader, partition table, boot_app0 metadata,
          and the application. It is built for 4 MB flash with the project's huge_app.csv.

          Alternative manual images:
            CYD-Satellite-Tracker-${FW_VERSION}-bootloader.bin  0x1000
            CYD-Satellite-Tracker-${FW_VERSION}-partitions.bin 0x8000
            CYD-Satellite-Tracker-${FW_VERSION}-boot_app0.bin   0xE000
            CYD-Satellite-Tracker-${FW_VERSION}-application.bin  0x10000

          Select ESP32 (not ESP32-S2/S3/C3), 4 MB flash. If using esptool, erase flash
          before first installation when migrating from a different partition layout.
          Erasing flash deletes existing settings/data.
          EOF

          sha256sum release/* > release/SHA256SUMS-${FW_VERSION}.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CYD-Satellite-Tracker-firmware-v2026.11.12.85
          path: release/
          if-no-files-found: error
          retention-days: 30

# CI retrigger after correcting esptool 4.9 merge_bin option names.
