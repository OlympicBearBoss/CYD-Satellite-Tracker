name: CYD firmware build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Prepare HTTPS trust roots
        run: |
          mkdir -p firmware/include/ca
          for root in gtsr1 gtsr2 gtsr3 gtsr4; do
            curl --fail --silent --show-error --location "https://pki.goog/repo/certs/${root}.pem" -o "firmware/include/ca/${root}.pem"
          done
          python - <<'PY'
          from pathlib import Path
          certs = [Path(f"firmware/include/ca/gtsr{i}.pem").read_text() for i in range(1, 5)]
          bundle = "\\n".join(certs)
          Path("firmware/include/RootCACert.h").write_text(
              '#pragma once\\n#include <Arduino.h>\\nstatic const char ROOT_CA_BUNDLE[] PROGMEM = R"ROOTCERTS('
              + bundle + ')ROOTCERTS";\\n'
          )
          PY

      - name: Build CYD firmware
        working-directory: firmware
        run: pio run -e cyd_esp32_2432s028

      - name: Collect firmware
        run: |
          mkdir -p release
          cp firmware/.pio/build/cyd_esp32_2432s028/firmware.bin release/CYD-Satellite-Tracker-boot-diagnostics.bin
          cp firmware/.pio/build/cyd_esp32_2432s028/firmware.elf release/CYD-Satellite-Tracker-boot-diagnostics.elf
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CYD-Satellite-Tracker-firmware
          path: release/
          if-no-files-found: error
          retention-days: 30
