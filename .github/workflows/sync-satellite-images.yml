name: Sync satellite image library

on:
  workflow_dispatch:
    inputs:
      max_checks:
        description: Maximum satellite records to inspect in this run
        required: false
        default: "300"
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

concurrency:
  group: satellite-image-library
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image optimizer
        run: npm install --no-save sharp
      - name: Download public satellite images
        env:
          MAX_IMAGE_CHECKS: ${{ inputs.max_checks || '300' }}
        run: node scripts/sync-satellite-images.mjs
      - name: Commit image library updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite-images/
          if git diff --cached --quiet; then
            echo "No image library changes."
          else
            git commit -m "data: sync satellite image library"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
