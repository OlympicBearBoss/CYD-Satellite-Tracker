[env:cyd_esp32_2432s028]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:embed_splash.py
monitor_speed = 115200
upload_speed = 460800

; CYD ESP32-2432S028 boards commonly use 4 MB flash.
; Single large application partition is used because this firmware
; currently exceeds the default 1.25 MB app partition.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  mikalhart/TinyGPSPlus@^1.0.3
  bblanchon/ArduinoJson@^7.4.2
  bodmer/TJpg_Decoder@^1.1.0
  https://github.com/Hopperpop/Sgp4-Library.git#7c82d31f9d9a286acde5ef55da8308fc93d2ba96

build_flags =
  -D USER_SETUP_LOADED
  -D ILI9341_2_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D USE_HSPI_PORT
  -D TOUCH_CS=33
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D SPI_FREQUENCY=4000000
  -D SPI_READ_FREQUENCY=4000000
  -D SPI_TOUCH_FREQUENCY=1000000

; IMPORTANT:
; This is a provisional CYD 2432S028 pin profile. Verify the exact PCB
; revision and ESP32 module before wiring or flashing to a live mechanism.
; XPT2046 touch uses the shared HSPI bus at a conservative 1 MHz.
